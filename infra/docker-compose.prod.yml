# 自建迷你主机 + Cloudflare Tunnel 的生产编排。
#
# 与旧的 VPS 方案的区别：
#   - 没有 Python 的 api 服务，对外接口全部由 go-api 提供；建表由同一个镜像的
#     migrate 子命令完成，机器上不需要 Python
#   - Caddy 只监听 :80，不申请证书也不暴露端口：外网入口是 cloudflared 的出站隧道
#   - 因此 APP_BEHIND_CLOUDFLARE 固定为 true。这个前提成立的前提是源站不可直连，
#     而 Caddy 没有 ports 段，容器只在 compose 网络内可达
#
# 用法见 docs/runbooks/deploy-selfhost.md。日常：
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d

x-api-env: &api-env
  APP_ENVIRONMENT: prod
  APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  APP_SESSION_COOKIE: sid
  APP_COOKIE_SECURE: "true"
  APP_CORS_ORIGINS: '["https://${DOMAIN}"]'
  APP_PUBLIC_DOMAIN: ${DOMAIN}
  APP_CURRENT_EVENT_SLUG: ${APP_CURRENT_EVENT_SLUG:-1024-challenge}
  APP_DB_MAX_CONNS: "20"
  # 只有 compose 网络里的 Caddy 会带转发头
  APP_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
  APP_BEHIND_CLOUDFLARE: "true"
  APP_RATE_LIMIT_RPS: ${APP_RATE_LIMIT_RPS:-50}
  APP_UPLOAD_DIR: /data/uploads
  # 素材总占用上限，0 表示不限制
  APP_UPLOAD_QUOTA_BYTES: ${APP_UPLOAD_QUOTA_BYTES:-0}
  # 比赛结束多少天后收口：作品进前序作品、报名投票关闭、身份回落
  APP_SEASON_CLOSE_AFTER_DAYS: ${APP_SEASON_CLOSE_AFTER_DAYS:-30}
  # 邮件：console（默认，只写日志）或 smtp；密码来自 .env.prod，不写进仓库
  APP_MAIL_DRIVER: ${APP_MAIL_DRIVER:-console}
  APP_MAIL_FROM: ${APP_MAIL_FROM:-}
  APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-1024 Challenge}"
  APP_SMTP_HOST: ${APP_SMTP_HOST:-}
  APP_SMTP_PORT: ${APP_SMTP_PORT:-465}
  APP_SMTP_USER: ${APP_SMTP_USER:-}
  APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
  APP_SMTP_TLS: ${APP_SMTP_TLS:-ssl}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: always
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 一次性建表/升级：跑完就退出，go-api 等它成功后才启动。
  # 与 go-api 共用同一个镜像，镜像由 go-api 的 build 段构建并打上 GO_API_IMAGE。
  migrate:
    image: ${GO_API_IMAGE:-challenge-go-api:local}
    restart: "no"
    logging: *default-logging
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]

  go-api:
    image: ${GO_API_IMAGE:-challenge-go-api:local}
    build:
      context: ../backend-go
      args:
        # 国内网络可设 GOPROXY=https://goproxy.cn,direct
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    restart: always
    logging: *default-logging
    environment: *api-env
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    logging: *default-logging
    # 不写 ports：入口是隧道，Caddy 只在 compose 网络内被 cloudflared 访问
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      go-api:
        condition: service_healthy

  tunnel:
    # 建议固定到具体版本号；latest 方便体验，但升级不受控
    image: cloudflare/cloudflared:latest
    restart: always
    logging: *default-logging
    environment:
      # 用环境变量而不是命令行参数：argv 会出现在 docker inspect 与进程列表里
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      caddy:
        condition: service_started

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
