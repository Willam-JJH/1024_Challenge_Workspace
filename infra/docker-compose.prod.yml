services:
  db:
    image: postgres:17-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENVIRONMENT: prod
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_SESSION_COOKIE: sid
      APP_COOKIE_SECURE: "true"
      APP_CORS_ORIGINS: '["https://${DOMAIN}"]'
      APP_PUBLIC_DOMAIN: ${DOMAIN}
      APP_BOT_CHECK_SECRET: ${APP_BOT_CHECK_SECRET}
      APP_UPLOAD_DIR: /data/uploads
      # 邮件：console（默认）或 smtp；密码来自 .env.prod，不写进仓库
      APP_MAIL_DRIVER: ${APP_MAIL_DRIVER:-console}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-1024 Challenge}"
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-465}
      APP_SMTP_USER: ${APP_SMTP_USER:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_TLS: ${APP_SMTP_TLS:-ssl}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  go-api:
    build:
      context: ../backend-go
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENVIRONMENT: prod
      # 与 api 共用同一个地址；Go 侧会把 postgresql+psycopg:// 归一化成 postgres://
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_SESSION_COOKIE: sid
      APP_COOKIE_SECURE: "true"
      APP_CORS_ORIGINS: '["https://${DOMAIN}"]'
      APP_PUBLIC_DOMAIN: ${DOMAIN}
      APP_CURRENT_EVENT_SLUG: ${APP_CURRENT_EVENT_SLUG:-1024-challenge}
      APP_DB_MAX_CONNS: "20"
      APP_UPLOAD_DIR: /data/uploads
      APP_MAIL_DRIVER: ${APP_MAIL_DRIVER:-console}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-1024 Challenge}"
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-465}
      APP_SMTP_USER: ${APP_SMTP_USER:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_TLS: ${APP_SMTP_TLS:-ssl}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      go-api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
