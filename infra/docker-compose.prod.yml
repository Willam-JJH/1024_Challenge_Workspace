services:
  db:
    image: postgres:17-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENVIRONMENT: prod
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_SESSION_COOKIE: sid
      APP_COOKIE_SECURE: "true"
      APP_CORS_ORIGINS: '["https://${DOMAIN}"]'
      APP_PUBLIC_DOMAIN: ${DOMAIN}
      APP_BOT_CHECK_SECRET: ${APP_BOT_CHECK_SECRET}
      # 只有同一 compose 网络里的 Caddy 会用转发头；直连（127.0.0.1）不受影响
      APP_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      # 橙云后面设为 true：采信 Caddy 透传的 CF-Connecting-IP。
      # 必须配合 scripts/cf_firewall.sh 限制 80/443 只收 Cloudflare 网段，
      # 否则绕过 CF 直连源站可以伪造这个头。
      APP_BEHIND_CLOUDFLARE: ${APP_BEHIND_CLOUDFLARE:-false}
      # 全域每 IP 每秒请求上限（0 = 关闭）；认证接口的阈值用代码默认值
      APP_RATE_LIMIT_RPS: ${APP_RATE_LIMIT_RPS:-50}
      APP_UPLOAD_DIR: /data/uploads
      # 邮件：console（默认）或 smtp；密码来自 .env.prod，不写进仓库
      APP_MAIL_DRIVER: ${APP_MAIL_DRIVER:-console}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-1024 Challenge}"
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-465}
      APP_SMTP_USER: ${APP_SMTP_USER:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_TLS: ${APP_SMTP_TLS:-ssl}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  go-api:
    build:
      context: ../backend-go
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      APP_ENVIRONMENT: prod
      # 与 api 共用同一个地址；Go 侧会把 postgresql+psycopg:// 归一化成 postgres://
      APP_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      APP_SESSION_COOKIE: sid
      APP_COOKIE_SECURE: "true"
      APP_CORS_ORIGINS: '["https://${DOMAIN}"]'
      APP_PUBLIC_DOMAIN: ${DOMAIN}
      APP_CURRENT_EVENT_SLUG: ${APP_CURRENT_EVENT_SLUG:-1024-challenge}
      APP_DB_MAX_CONNS: "20"
      APP_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
      APP_BEHIND_CLOUDFLARE: ${APP_BEHIND_CLOUDFLARE:-false}
      APP_RATE_LIMIT_RPS: ${APP_RATE_LIMIT_RPS:-50}
      APP_UPLOAD_DIR: /data/uploads
      APP_MAIL_DRIVER: ${APP_MAIL_DRIVER:-console}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_FROM_NAME: "${APP_MAIL_FROM_NAME:-1024 Challenge}"
      APP_SMTP_HOST: ${APP_SMTP_HOST:-}
      APP_SMTP_PORT: ${APP_SMTP_PORT:-465}
      APP_SMTP_USER: ${APP_SMTP_USER:-}
      APP_SMTP_PASSWORD: ${APP_SMTP_PASSWORD:-}
      APP_SMTP_TLS: ${APP_SMTP_TLS:-ssl}
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    restart: always
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      # 端口可用环境变量挪开：与别的站点共用一台机器时，演练可以只占 8443，
      # 由 Cloudflare 的 Origin Rules 把回源端口改过来。
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # TLS_MODE=origin（默认）用 Origin CA 证书；auto 用 Let's Encrypt
      - ./caddy/tls-${TLS_MODE:-origin}.caddy:/etc/caddy/tls/active.caddy:ro
      # 由 scripts/cf_provision.py 生成，权限 600；目录已在 .gitignore 里
      - ./secrets/tls:/etc/caddy/secrets:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      go-api:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
