services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: challenge
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d challenge"]
      interval: 5s
      retries: 10

  api:
    build:
      context: ../backend
    environment:
      APP_DATABASE_URL: postgresql+psycopg://app:app@db:5432/challenge
      APP_ENVIRONMENT: dev
      APP_BEHIND_CLOUDFLARE: "false"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  db-data:
